<!DOCTYPE html>
<html>
<script src="./js/vendor/aframe.min.js"></script>
<script src="./js/vendor/aframe-ar.js"></script>
<script src="./js/vendor/zingtouch.min.js"></script>

<script src="./js/3d-ops.js"></script>
<script src="./js/ar-cam.js"></script>
<script src="./js/ui-utils.js"></script>
<link rel="stylesheet" href="./css/styles.css">

<body style="margin : 0px; overflow: hidden;">
    <a-scene id="scene" embedded 
        arjs="debug: true; debugUIEnabled: true; detectionMode: mono;" 
        vr-mode-ui="enabled: false"
        renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
        style="width: 100%; height: 100%;">
        <a-marker preset="hiro" smooth="true">
            <a-entity id='theModel' position="0 6.25 0" rotation="45 0 0" scale="12.5 12.5 12.5" gltf-model="./assets/3d-models/doggy.glb"></a-entity>
        </a-marker>
        <a-entity id="camera" camera look-controls="enabled: false" touch-controls="enabled: false"></a-entity>
    </a-scene>

    <div id="company-name" style="position: absolute; bottom: 40px; left: 0; right: 80px; text-align: center; color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 1.6em; text-shadow: none; pointer-events: none;">Soahn Design</div>

    <button id="rotate-right-button" style="position: absolute; bottom: 20px; right: 20px; z-index: 20; width: 60px; height: 60px; border: 1px solid white; border-radius: 15px; background-color: rgba(0, 0, 0, 0.5); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer;">
        <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 12H16M13 9L16 12L13 15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
</body>

</html>
